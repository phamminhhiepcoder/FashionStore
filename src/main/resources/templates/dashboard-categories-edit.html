<!DOCTYPE html>
<html lang="vi" xmlns:th="www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>

<body>
    <th:block th:replace="layout/admin-layout :: layout">
        <th:block th:fragment="pageContent">
            <script th:if="${editCategory != null}">
                swal("Cập nhật loại sản phẩm thành công!", "", "success");
            </script>

            <form action="/dashboard-categories/edit" method="post" enctype="multipart/form-data">
                <div id="titlebar">
                    <div class="row">
                        <div class="col-md-12">
                            <h2>Chỉnh sửa loại sản phẩm</h2>
                            <nav id="breadcrumbs">
                                <ul>
                                    <li><a href="#">Trang chủ</a></li>
                                    <li><a href="#">Bảng điều khiển</a></li>
                                    <li><a href="#">Loại sản phẩm</a></li>
                                    <li>Chỉnh sửa loại sản phẩm</li>
                                </ul>
                            </nav>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-lg-12">
                        <div id="add-listing">
                            <div class="add-listing-section">
                                <div class="add-listing-headline">
                                    <h3>
                                        <i class="sl sl-icon-doc"></i> Thông tin cơ bản
                                    </h3>
                                </div>

                                <div class="row with-forms">
                                    <div class="col-md-12">
                                        <h5>Tên loại sản phẩm</h5>
                                        <input style="display: none;" name="category_id" th:value="${category.id}">
                                        <input name="category_name" class="search-field" type="text"
                                            th:value="${category.category_Name}" placeholder="Nhập tên loại sản phẩm" />
                                    </div>
                                </div>

                            </div>

                            <button class="button preview">
                                Lưu thay đổi <i class="fa fa-arrow-circle-right"></i>
                            </button>
                        </div>
                    </div>

                    <div class="col-md-12">
                        <div class="copyrights"></div>
                    </div>
                </div>
            </form>
        </th:block>
    </th:block>

</body>

</html>
