<!DOCTYPE html>
<html lang="en-US" xmlns:th="www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
<th:block th:replace="layout/user-layout :: layout">
    <th:block th:fragment="pageContent">
        <section class="contact spad">
            <div class="container">
                <div class="row">
                    <div class="col-lg-6 col-md-6">
                        <div class="contact__text">
                            <div class="section-title">
                                <span>Information</span>
                                <h2>Liên Hệ</h2>
                                <p>As you might expect of a company that began as a high-end
                                    interiors contractor, we pay strict attention.</p>
                            </div>
                            <ul>
                                <li>
                                    <h4>America</h4>
                                    <p>
                                        195 E Parker Square Dr, Parker, CO 801 <br />+43 982-314-0958
                                    </p>
                                </li>
                                <li>
                                    <h4>France</h4>
                                    <p>
                                        109 Avenue Léon, 63 Clermont-Ferrand <br />+12 345-423-9893
                                    </p>
                                </li>
                            </ul>
                        </div>
                    </div>
                    <div class="col-lg-6 col-md-6">
                        <div class="contact__form">
                            <form action="#">
                                <div class="row">
                                    <div class="col-lg-6">
                                        <input type="text" placeholder="Họ tên của bạn">
                                    </div>
                                    <div class="col-lg-6">
                                        <input type="text" placeholder="Email">
                                    </div>
                                    <div class="col-lg-12">
                                        <textarea placeholder="Tin nhắn"></textarea>
                                        <button type="submit" class="site-btn">Gửi</button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>

    </th:block>
</th:block>
</body>

</html>
