<!DOCTYPE html>
<html lang="vi" xmlns:th="www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>

<body>
    <th:block th:replace="layout/admin-layout :: layout">
        <th:block th:fragment="pageContent">
            <script th:if="${editProduct != null}">
                swal("Cập nhật sản phẩm thành công!", "", "success");
            </script>

            <form action="/dashboard-myproducts/edit" method="post" enctype="multipart/form-data">
                <div id="titlebar">
                    <div class="row">
                        <div class="col-md-12">
                            <h2>Chỉnh sửa sản phẩm</h2>
                            <nav id="breadcrumbs">
                                <ul>
                                    <li><a href="#">Trang chủ</a></li>
                                    <li><a href="#">Bảng điều khiển</a></li>
                                    <li><a href="#">Sản phẩm</a></li>
                                    <li>Chỉnh sửa sản phẩm</li>
                                </ul>
                            </nav>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-lg-12">
                        <div id="add-listing">
                            <div class="add-listing-section">
                                <div class="add-listing-headline">
                                    <h3>
                                        <i class="sl sl-icon-doc"></i> Thông tin cơ bản
                                    </h3>
                                </div>

                                <div class="row with-forms">
                                    <div class="col-md-6">
                                        <h5>Tên sản phẩm</h5>
                                        <input style="display: none;" name="product_id" th:value="${product.id}">
                                        <input name="product_name" class="search-field" type="text"
                                            th:value="${product.productName}" placeholder="Nhập tên sản phẩm" />
                                    </div>
                                    <div class="col-md-6">
                                        <h5>Danh mục</h5>
                                        <select name="category" class="chosen-select-no-single">
                                            <option th:value="${product.category.id}" label="blank"
                                                th:text="${product.category.category_Name}"></option>
                                            <th:block th:each="y : ${listCategories}">
                                                <option th:value="${y.id}" th:if="${y.id != product.category.id}"
                                                    th:text="${y.category_Name}"></option>
                                            </th:block>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <div class="add-listing-section margin-top-45">
                                <div class="add-listing-headline">
                                    <h3>
                                        <i class="sl sl-icon-docs"></i> Chi tiết sản phẩm
                                    </h3>
                                </div>
                                <div class="form">
                                    <h5>Giới tính</h5>
                                    <select name="gender" class="chosen-select-no-single">
                                        <option value="" th:if="${product.gender == null}">-- Chọn giới tính --</option>
                                        <option value="Nam" th:selected="${product.gender == 'Nam'}">Nam</option>
                                        <option value="Nữ" th:selected="${product.gender == 'Nữ'}">Nữ</option>
                                        <option value="Unisex" th:selected="${product.gender == 'Unisex'}">Unisex
                                        </option>
                                    </select>
                                </div>

                                <div class="form">
                                    <h5>Mô tả</h5>
                                    <textarea th:field="${product.description}" name="description" class="WYSIWYG"
                                        cols="40" rows="3" id="summary" spellcheck="true"
                                        placeholder="Nhập mô tả sản phẩm"></textarea>
                                </div>
                            </div>

                            <button class="button preview">
                                Lưu thay đổi <i class="fa fa-arrow-circle-right"></i>
                            </button>
                        </div>
                    </div>

                    <div class="col-md-12">
                        <div class="copyrights"></div>
                    </div>
                </div>
            </form>
        </th:block>
    </th:block>
</body>

</html>
