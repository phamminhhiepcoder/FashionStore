<!DOCTYPE html>
<html lang="vi" xmlns:th="www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>

<body>
    <th:block th:replace="layout/admin-layout :: layout">
        <th:block th:fragment="pageContent">
            <script th:if="${editUser != null}">
                swal("Cập nhật người dùng thành công!", "", "success");
            </script>

            <form action="/dashboard-users/edit" method="post" enctype="multipart/form-data">
                <div id="titlebar">
                    <div class="row">
                        <div class="col-md-12">
                            <h2>Chỉnh sửa người dùng</h2>
                            <nav id="breadcrumbs">
                                <ul>
                                    <li><a href="#">Trang chủ</a></li>
                                    <li><a href="#">Bảng điều khiển</a></li>
                                    <li><a href="#">Người dùng</a></li>
                                    <li>Chỉnh sửa người dùng</li>
                                </ul>
                            </nav>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-lg-12">
                        <div id="add-listing">
                            <div class="add-listing-section">
                                <div class="add-listing-headline">
                                    <h3>
                                        <i class="sl sl-icon-doc"></i> Thông tin cơ bản
                                    </h3>
                                </div>

                                <div class="row with-forms">

                                    <!-- ID -->
                                    <div class="col-md-6">
                                        <h5>Mã người dùng</h5>
                                        <input type="text" name="id" class="search-field" th:value="${user.id}"
                                            readonly />
                                    </div>

                                    <!-- Username -->
                                    <div class="col-md-6">
                                        <h5>Tên người dùng</h5>
                                        <input type="text" name="username" class="search-field"
                                            th:value="${user.username}" placeholder="Nhập tên người dùng" />
                                    </div>

                                    <div class="col-md-6">
                                        <h5>Mật khẩu mới</h5>
                                        <input type="password" name="password" class="search-field" value=""
                                            placeholder="Nhập mật khẩu mới (để trống nếu giữ nguyên)" />
                                        <small class="text-muted"
                                            style="color: #888; font-size: 12px; display: block; margin-top: 5px;">
                                            * Để trống ô này nếu bạn không muốn thay đổi mật khẩu hiện tại của người
                                            dùng.
                                        </small>
                                    </div>
                                    <!-- Email -->
                                    <div class="col-md-6">
                                        <h5>Email</h5>
                                        <input type="email" name="email" class="search-field" th:value="${user.email}"
                                            placeholder="Nhập email" />
                                    </div>

                                    <!-- Phone -->
                                    <div class="col-md-6">
                                        <h5>Số điện thoại</h5>
                                        <input type="text" name="phone_Number" class="search-field"
                                            th:value="${user.phone_Number}" placeholder="Nhập số điện thoại" />
                                    </div>

                                    <!-- Role -->
                                    <div class="col-md-6">
                                        <h5>Vai trò</h5>
                                        <select name="role" class="chosen-select-no-single">
                                            <option value="user" th:selected="${user.role == 'user'}">
                                                USER
                                            </option>
                                            <option value="admin" th:selected="${user.role == 'admin'}">
                                                ADMIN
                                            </option>
                                        </select>
                                    </div>
                                </div>

                            </div>

                            <button class="button preview">
                                Lưu thay đổi <i class="fa fa-arrow-circle-right"></i>
                            </button>
                        </div>
                    </div>

                    <div class="col-md-12">
                        <div class="copyrights"></div>
                    </div>
                </div>
            </form>
        </th:block>
    </th:block>

</body>

</html>
