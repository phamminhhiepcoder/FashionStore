<!DOCTYPE html>
<html lang="vi" xmlns:th="www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>

<body>
    <th:block th:replace="layout/admin-layout :: layout">
        <th:block th:fragment="pageContent">
            <form action="dashboard-addproduct" method="post" enctype="multipart/form-data">
                <div id="titlebar">
                    <div class="row">
                        <div class="col-md-12">
                            <h2>Thêm sản phẩm</h2>
                            <nav id="breadcrumbs">
                                <ul>
                                    <li><a href="#">Trang chủ</a></li>
                                    <li><a href="#">Bảng điều khiển</a></li>
                                    <li>Thêm sản phẩm</li>
                                </ul>
                            </nav>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-lg-12">
                        <div id="add-listing">
                            <div class="add-listing-section">
                                <div class="add-listing-headline">
                                    <h3>
                                        <i class="sl sl-icon-doc"></i> Thông tin cơ bản
                                    </h3>
                                </div>

                                <div class="row with-forms">
                                    <div class="col-md-6">
                                        <h5>Tên sản phẩm</h5>
                                        <input name="product_name" class="search-field" type="text" value=""
                                            placeholder="Nhập tên sản phẩm" />
                                    </div>
                                    <div class="col-md-6">
                                        <h5>Danh mục</h5>
                                        <select name="category" class="chosen-select-no-single">
                                            <option value="1" label="blank"
                                                th:text="${listCategories[0].category_Name}">
                                            </option>
                                            <th:block th:each="y : ${listCategories}">
                                                <option th:value="${y.id}" th:if="${yStat.index >0}"
                                                    th:text="${y.category_Name}"></option>
                                            </th:block>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <div class="add-listing-section margin-top-45">
                                <div class="add-listing-headline">
                                    <h3>
                                        <i class="sl sl-icon-docs"></i> Chi tiết sản phẩm
                                    </h3>
                                </div>
                                <div class="form">
                                    <h5>Giới tính</h5>
                                    <select name="gender" class="chosen-select-no-single">
                                        <option value="">-- Chọn giới tính --</option>
                                        <option value="Nam" >Nam</option>
                                        <option value="Nữ" >Nữ</option>
                                        <option value="Unisex">Unisex
                                        </option>
                                    </select>
                                </div>
                                <div class="form">
                                    <h5>Mô tả</h5>
                                    <textarea name="description" class="WYSIWYG" cols="40" rows="3" id="summary"
                                        spellcheck="true" placeholder="Nhập mô tả sản phẩm"></textarea>
                                </div>
                            </div>


                            <button class="button preview">
                                Thêm sản phẩm mới <i class="fa fa-arrow-circle-right"></i>
                            </button>
                        </div>
                    </div>

                    <div class="col-md-12">
                        <div class="copyrights"></div>
                    </div>
                </div>
            </form>
        </th:block>
    </th:block>

    <script>
        $(".opening-day.js-demo-hours .chosen-select").each(
            function () {
                $(this).append(
                    '' + '<option></option>'
                    + '<option>Đóng cửa</option>'
                    + '<option>1 SA</option>'
                    + '<option>2 SA</option>'
                    + '<option>3 SA</option>'
                    + '<option>4 SA</option>'
                    + '<option>5 SA</option>'
                    + '<option>6 SA</option>'
                    + '<option>7 SA</option>'
                    + '<option>8 SA</option>'
                    + '<option>9 SA</option>'
                    + '<option>10 SA</option>'
                    + '<option>11 SA</option>'
                    + '<option>12 CH</option>'
                    + '<option>1 CH</option>'
                    + '<option>2 CH</option>'
                    + '<option>3 CH</option>'
                    + '<option>4 CH</option>'
                    + '<option>5 CH</option>'
                    + '<option>6 CH</option>'
                    + '<option>7 CH</option>'
                    + '<option>8 CH</option>'
                    + '<option>9 CH</option>'
                    + '<option>10 CH</option>'
                    + '<option>11 CH</option>'
                    + '<option>12 SA</option>');
            });
    </script>

</body>

</html>
